# Chạy CẢ HỆ THỐNG từ Docker image đã release trên GHCR (không cần code, không cần build).
#
#   docker compose -f docker-compose.app.yml up -d      bật (tự đúng thứ tự)
#   docker compose -f docker-compose.app.yml ps         xem trạng thái
#   docker compose -f docker-compose.app.yml logs -f    xem log
#   docker compose -f docker-compose.app.yml down       tắt (tự theo thứ tự ngược)
#
# Khác với ./run-local.sh (chạy từ code đang sửa), file này chạy đúng bản đã release.
# Hai cách dùng chung cổng 8080-8085/8761: chỉ bật một trong hai.
#
# identity-service KHÔNG chạy profile local nên không tự sinh khóa ký JWT:
# phải có JWT_PRIVATE_KEY + JWT_KEY_ID trong .env (xem .env.example), thiếu là container dừng ngay.
# order-service xin token ở identity bằng ORDER_SERVICE_CLIENT_SECRET: cũng bắt buộc có trong .env.
#
# Lưu ý: bên trong container, "localhost" là CHÍNH container đó. Các container gọi nhau
# bằng TÊN SERVICE (postgres, discovery-server...) và cổng bên trong (postgres là 5432, không phải 5433).

include:
  - docker-compose.yml          # lấy service postgres (cùng container, cùng dữ liệu với run-local.sh)

services:
  discovery-server:
    image: ghcr.io/flower-shop-teddy/flower-shop-discovery-server:${DISCOVERY_VERSION:-0.3.0}
    container_name: flowershop-discovery
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  identity-service:
    image: ghcr.io/flower-shop-teddy/flower-shop-identity-service:${IDENTITY_VERSION:-0.2.0}
    container_name: flowershop-identity
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/identity_db
      DB_USERNAME: identity_user
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_pass_local}
      EUREKA_URL: http://discovery-server:8761/eureka
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?Thiếu JWT_PRIVATE_KEY trong .env (xem .env.example)}
      JWT_KEY_ID: ${JWT_KEY_ID:?Thiếu JWT_KEY_ID trong .env}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Service client cho order-service (= identity.service-clients[0] trong application.yml)
      IDENTITY_SERVICECLIENTS_0_CLIENTID: order-service
      IDENTITY_SERVICECLIENTS_0_SECRET: ${ORDER_SERVICE_CLIENT_SECRET:?Thiếu ORDER_SERVICE_CLIENT_SECRET trong .env (xem .env.example)}
      IDENTITY_SERVICECLIENTS_0_PERMISSIONS: customer:read,inventory:reserve
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  catalog-service:
    image: ghcr.io/flower-shop-teddy/flower-shop-catalog-service:${CATALOG_VERSION:-0.3.0}
    container_name: flowershop-catalog
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/catalog_db
      DB_USERNAME: catalog_user
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_pass_local}   # mật khẩu máy dev (infra/postgres/init)
      EUREKA_URL: http://discovery-server:8761/eureka
      IDENTITY_JWKS_URI: http://identity-service:8083/.well-known/jwks.json   # trong container, localhost là chính nó
    depends_on:                 # chỉ bật khi DB, Eureka và identity (nơi lấy public key) đã healthy
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  customer-service:
    image: ghcr.io/flower-shop-teddy/flower-shop-customer-service:${CUSTOMER_VERSION:-0.3.0}
    container_name: flowershop-customer
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/customer_db
      DB_USERNAME: customer_user
      DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:-customer_pass_local}
      EUREKA_URL: http://discovery-server:8761/eureka
      IDENTITY_JWKS_URI: http://identity-service:8083/.well-known/jwks.json
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  inventory-service:
    image: ghcr.io/flower-shop-teddy/flower-shop-inventory-service:${INVENTORY_VERSION:-0.2.0}
    container_name: flowershop-inventory
    ports:
      - "8084:8084"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      DB_USERNAME: inventory_user
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory_pass_local}
      EUREKA_URL: http://discovery-server:8761/eureka
      IDENTITY_JWKS_URI: http://identity-service:8083/.well-known/jwks.json
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      catalog-service:          # nhập lô phải hỏi catalog SKU có tồn tại không
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8084/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  order-service:
    image: ghcr.io/flower-shop-teddy/flower-shop-order-service:${ORDER_VERSION:-0.1.0}
    container_name: flowershop-order
    ports:
      - "8085:8085"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      DB_USERNAME: order_user
      DB_PASSWORD: ${ORDER_DB_PASSWORD:-order_pass_local}
      EUREKA_URL: http://discovery-server:8761/eureka
      IDENTITY_JWKS_URI: http://identity-service:8083/.well-known/jwks.json
      ORDER_SERVICE_CLIENT_SECRET: ${ORDER_SERVICE_CLIENT_SECRET:?Thiếu ORDER_SERVICE_CLIENT_SECRET trong .env}
    depends_on:                 # đặt đơn gọi cả catalog, customer, inventory
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8085/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  api-gateway:
    image: ghcr.io/flower-shop-teddy/flower-shop-api-gateway:${GATEWAY_VERSION:-0.3.0}
    container_name: flowershop-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      IDENTITY_JWKS_URI: http://identity-service:8083/.well-known/jwks.json
    depends_on:
      discovery-server:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  # Giao diện web: nginx phục vụ React + chuyển /api sang gateway (cùng origin, không cần CORS).
  # Chưa có image trên GHCR (trước lần release đầu) thì compose tự build từ ./web-app.
  web-app:
    image: ghcr.io/flower-shop-teddy/flower-shop-web-app:${WEB_APP_VERSION:-0.1.0}
    build: ./web-app
    container_name: flowershop-web
    ports:
      - "3000:8080"
    environment:
      GATEWAY_URL: http://api-gateway:8080
    depends_on:
      api-gateway:
        condition: service_healthy
