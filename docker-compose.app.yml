# Chạy CẢ HỆ THỐNG từ Docker image đã release trên GHCR (không cần code, không cần build).
#
#   docker compose -f docker-compose.app.yml up -d      bật (tự đúng thứ tự)
#   docker compose -f docker-compose.app.yml ps         xem trạng thái
#   docker compose -f docker-compose.app.yml logs -f    xem log
#   docker compose -f docker-compose.app.yml down       tắt (tự theo thứ tự ngược)
#
# Khác với ./run-local.sh (chạy từ code đang sửa), file này chạy đúng bản đã release.
# Hai cách dùng chung cổng 8080/8081/8761: chỉ bật một trong hai.
#
# Lưu ý: bên trong container, "localhost" là CHÍNH container đó. Các container gọi nhau
# bằng TÊN SERVICE (postgres, discovery-server...) và cổng bên trong (postgres là 5432, không phải 5433).

include:
  - docker-compose.yml          # lấy service postgres (cùng container, cùng dữ liệu với run-local.sh)

services:
  discovery-server:
    image: ghcr.io/flower-shop-teddy/flower-shop-discovery-server:${DISCOVERY_VERSION:-0.1.0}
    container_name: flowershop-discovery
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  catalog-service:
    image: ghcr.io/flower-shop-teddy/flower-shop-catalog-service:${CATALOG_VERSION:-0.1.0}
    container_name: flowershop-catalog
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/catalog_db
      DB_USERNAME: catalog_user
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_pass_local}   # mật khẩu máy dev (infra/postgres/init)
      EUREKA_URL: http://discovery-server:8761/eureka
    depends_on:                 # chỉ bật khi DB và Eureka đã healthy
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  api-gateway:
    image: ghcr.io/flower-shop-teddy/flower-shop-api-gateway:${GATEWAY_VERSION:-0.1.0}
    container_name: flowershop-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
    depends_on:
      discovery-server:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
